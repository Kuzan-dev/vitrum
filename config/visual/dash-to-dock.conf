# Dash to Dock v110 — fase A (sin parche): los ajustes son globales, iguales en todos los monitores.
# Formato: clave valor (valor en sintaxis GVariant). Lo aplica scripts/visual.sh (subpaso extensions / dock).
dock-position 'BOTTOM'
extend-height false
dash-max-icon-size 48
show-apps-at-top false
show-show-apps-button true
multi-monitor true
preferred-monitor-by-connector 'primary'
dock-fixed false
autohide true
intellihide true
intellihide-mode 'ALL_WINDOWS'
require-pressure-to-show true
# 50 (antes 100): Dash to Dock exige este empuje en show-delay (0,25 s); con 100 el dock no salía si el ratón bajaba despacio
pressure-threshold 50.0
autohide-in-fullscreen false
transparency-mode 'DEFAULT'
custom-theme-shrink true
apply-custom-theme false
