# Fase 3, subpaso 3 (panel): ajustes de Blur my Shell, Just Perfection y Logo Menu.
# Formato: <uuid de la extensión (para --schemadir)> <esquema> <clave> <valor GVariant>
# Lo aplica scripts/visual.sh (subpaso panel). Se fijan explícitamente aunque coincidan con
# el valor por defecto, para que el resultado no dependa de cambios de defaults.

# --- Blur my Shell: barra y dock → config/visual/glass/ (variantes sutil|media|cristal) ---

# --- Blur my Shell: popups desactivados (evita marco rectangular en GNOME 50) ---
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.popup blur false

blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.overview blur true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.lockscreen blur true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.applications blur false

# --- Just Perfection v37 ---
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection activities-button false
# 2 = TOP_END (arriba a la derecha)
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection notification-banner-position 2
# 0 = arrancar en el escritorio, no en la vista general (como macOS)
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection startup-status 0
# Paso 2 del rediseño: reloj a la derecha, al final (offset se limita al nº de elementos)
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection clock-menu-position 1
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection clock-menu-position-offset 20
# Altura de la barra en px (0 = la de GNOME, ~32 px). 28 = estilo macOS; subir a 32 si queda apretada
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection panel-size 28

# --- Logo Menu v45: logo de Fedora monocromo (como la manzana de macOS) ---
# SymbolicDistroIcons[1] = fedora-logo-symbolic.svg
logomenu@aryan_k org.gnome.shell.extensions.logo-menu symbolic-icon true
logomenu@aryan_k org.gnome.shell.extensions.logo-menu menu-button-icon-image 1
# El botón "Actividades" ya no está en la barra → el menú incluye la entrada "Actividades"
logomenu@aryan_k org.gnome.shell.extensions.logo-menu show-activities-button false
# Fedora 44 usa Ptyxis, no gnome-terminal
logomenu@aryan_k org.gnome.shell.extensions.logo-menu menu-button-terminal 'ptyxis'
logomenu@aryan_k org.gnome.shell.extensions.logo-menu show-power-options true
logomenu@aryan_k org.gnome.shell.extensions.logo-menu show-lockscreen true

# --- Paso 3 del rediseño: brillo DDC/CI dentro del Control Center ---
# GNOME 50 no controla el brillo físico de monitores externos (Mutter solo tiene sysfs y el blanco de
# referencia HDR). Diseño: un deslizador "Brillo" (todos los monitores) con flecha → submenú con un
# deslizador por monitor, como Volumen/Bluetooth. Monitores nuevos: se detectan solos.
# Parche local (config/visual/patches/…ddcutil….patch): sin "Settings/Reload" en el submenú, cabecera
# traducida, nombres con ancho fijo (alineados) y oculta el deslizador nativo de GNOME.
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil button-location 1
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil hide-system-indicator true
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil show-all-slider true
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil show-sliders-in-submenu true
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil only-all-slider false
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil show-display-name true
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil show-value-label false
display-brightness-ddcutil@themightydeity.github.com org.gnome.shell.extensions.display-brightness-ddcutil show-osd true
# quick-settings-backlight NO es el deslizador de brillo (es un toggle de retroiluminación): valor por defecto
just-perfection-desktop@just-perfection org.gnome.shell.extensions.just-perfection quick-settings-backlight true
