# Variante de cristal 'media': Más color del fondo en barra y dock; mismo estilo oscuro del dock.
# Formato de panel.conf. La aplica: sudo ~/dotfiles/scripts/visual.sh <usuario> glass
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell pipelines {'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_000000000000'>, 'params': <{'radius': <30>, 'brightness': <0.6>}>}>]>}, 'pipeline_default_rounded': {'name': <'Default rounded'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_000000000001'>, 'params': <{'radius': <30>, 'brightness': <0.6>}>}>, <{'type': <'corner'>, 'id': <'effect_000000000002'>, 'params': <{'radius': <24>}>}>]>}, 'gg_panel': {'name': <'GoldenGate barra'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_gg_panel_blur'>, 'params': <{'radius': <24>, 'brightness': <0.86>}>}>]>}, 'gg_dock': {'name': <'GoldenGate dock'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_gg_dock_blur'>, 'params': <{'radius': <22>, 'brightness': <0.8>}>}>, <{'type': <'corner'>, 'id': <'effect_gg_dock_corner'>, 'params': <{'radius': <24>}>}>]>}}
# Barra: desenfoque estático del fondo (estable, deja pasar su color), sin fondo propio
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.panel blur true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.panel static-blur true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.panel pipeline 'gg_panel'
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.panel override-background true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.panel style-panel 0
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.panel unblur-in-overview true
# Dock: desenfoque estático con esquina de 24 px (= radio de .dash-background de Dash to Dock)
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.dash-to-dock blur true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.dash-to-dock static-blur true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.dash-to-dock pipeline 'gg_dock'
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.dash-to-dock corner-radius 24
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.dash-to-dock override-background true
blur-my-shell@aunetx org.gnome.shell.extensions.blur-my-shell.dash-to-dock style-dash-to-dock 2
