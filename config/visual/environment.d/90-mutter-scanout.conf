# Instalado por scripts/visual.sh (paso mutter-scanout). Ver docs/capas.md.
# Mutter 50.6 + NVIDIA 615: tras cambiar de usuario, el escaneo directo dejaba el dock sin componer en el
# LG (parpadeo/desaparece). Desactivarlo lo evita. Afecta a toda la sesión de este usuario: las apps a
# pantalla completa pasan siempre por el compositor. Opción de depuración de Mutter: revisar en cada
# actualización de GNOME que siga existiendo (strings /usr/lib64/libmutter-*.so.0 | grep disable-direct-scanout).
# Vuelta atrás: sudo ~/dotfiles/scripts/visual.sh <usuario> mutter-scanout-remove, y cerrar/abrir sesión.
MUTTER_DEBUG_PAINT=disable-direct-scanout
